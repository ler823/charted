AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  charted-backend

  Sample SAM Template for charted-backend

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  GetUserTest:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: get_user_test/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - arm64
      Environment:
        Variables:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
      Events:
        HelloWorld:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /getusertest
            Method: get
  CreatePinFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: create_pin/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - arm64
      Environment:
        Variables:
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
      Events:
        Createpin:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /createpin
            Method: post

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  CreatePinApi:
    Description: "API Gateway endpoint URL for Prod stage for Create Pin function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/createpin/"
  GetUserTestApi:
    Description: "API Gateway endpoint URL for Prod stage for Get Pin function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/getusertest/"
